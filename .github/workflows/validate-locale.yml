name: 로케일 검증

on:
  pull_request:
    paths:
      - "locales/**"
      - "locale-meta.json"
      - ".github/workflows/validate-locale.yml"

jobs:
  validate:
    name: 로케일 파일 검증
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: locale-meta.json 스키마 검증
        run: |
          node -e "
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('locale-meta.json', 'utf-8'));

          const errors = [];

          // 필수 최상위 필드
          if (typeof meta.schemaVersion !== 'number') {
            errors.push('schemaVersion 필드가 없거나 숫자가 아닙니다.');
          }
          if (!Array.isArray(meta.officialLocales)) {
            errors.push('officialLocales 필드가 없거나 배열이 아닙니다.');
          }
          if (typeof meta.locales !== 'object' || meta.locales === null) {
            errors.push('locales 필드가 없거나 객체가 아닙니다.');
          }

          // 각 locale 엔트리 검증
          const allAliases = [];
          for (const [code, entry] of Object.entries(meta.locales || {})) {
            if (!entry.name) {
              errors.push(code + ': name 필드가 없습니다.');
            }
            if (!Array.isArray(entry.aliases)) {
              errors.push(code + ': aliases 필드가 없거나 배열이 아닙니다.');
            } else {
              allAliases.push(...entry.aliases.map(a => ({ alias: a, locale: code })));
            }
            if (typeof entry.versions !== 'object') {
              errors.push(code + ': versions 필드가 없거나 객체가 아닙니다.');
            } else {
              for (const [ver, vInfo] of Object.entries(entry.versions)) {
                if (!vInfo.file) errors.push(code + '/' + ver + ': file 필드가 없습니다.');
                if (!vInfo.exportName) errors.push(code + '/' + ver + ': exportName 필드가 없습니다.');
                if (!vInfo.coverage) errors.push(code + '/' + ver + ': coverage 필드가 없습니다. /lang 명령어에서 번역률이 undefined로 표시됩니다.');
              }
            }
          }

          // aliases 중복 검사
          const seen = {};
          for (const { alias, locale } of allAliases) {
            const lower = alias.toLowerCase();
            if (seen[lower] && seen[lower] !== locale) {
              errors.push('alias 중복: \"' + alias + '\"이(가) ' + seen[lower] + '과(와) ' + locale + '에서 모두 사용됩니다.');
            }
            seen[lower] = locale;
          }

          // aliases가 officialLocales와 충돌하는지 검사
          // 공식 locale 코드와 겹치는 alias가 있으면 런타임에서 해당 locale에
          // 도달할 수 없으므로 (installLanguage()가 공식 locale을 먼저 확인) CI에서 차단
          const officialSet = new Set((meta.officialLocales || []).map(l => l.toLowerCase()));
          for (const { alias, locale } of allAliases) {
            if (officialSet.has(alias.toLowerCase())) {
              errors.push(locale + ': alias \"' + alias + '\"이(가) 공식 locale과 충돌합니다. 런타임에서 해당 커뮤니티 locale에 도달할 수 없습니다.');
            }
          }
          // locale 코드 자체가 officialLocales와 충돌하는지도 검사
          for (const code of Object.keys(meta.locales || {})) {
            if (officialSet.has(code.toLowerCase())) {
              errors.push(code + ': 커뮤니티 locale 코드가 공식 locale과 충돌합니다.');
            }
          }

          // alias가 다른 커뮤니티 locale 코드와 충돌하는지 검사
          // resolveAlias()는 코드 정확 일치를 alias 탐색보다 먼저 수행하므로,
          // locale B의 alias가 locale A의 코드와 같으면 그 alias는 도달 불가능합니다.
          const communityCodeMap = {};
          for (const code of Object.keys(meta.locales || {})) {
            communityCodeMap[code.toLowerCase()] = code;
          }
          for (const { alias, locale } of allAliases) {
            const lower = alias.toLowerCase();
            if (communityCodeMap[lower] && communityCodeMap[lower] !== locale) {
              const conflictCode = communityCodeMap[lower];
              errors.push(locale + ': alias \"' + alias + '\"이(가) 다른 커뮤니티 locale 코드 \"' + conflictCode + '\"와 충돌합니다. resolveAlias()에서 코드 일치가 alias보다 우선하므로 이 alias는 도달 불가능합니다.');
            }
          }

          if (errors.length > 0) {
            console.error('❌ locale-meta.json 검증 실패:\\n');
            errors.forEach(e => console.error('  - ' + e));
            process.exit(1);
          }

          console.log('✅ locale-meta.json 검증 통과');
          "

      - name: chunk 파일 문법 검증
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const meta = JSON.parse(fs.readFileSync('locale-meta.json', 'utf-8'));
          const errors = [];

          for (const [code, entry] of Object.entries(meta.locales)) {
            for (const [ver, vInfo] of Object.entries(entry.versions)) {
              const filePath = vInfo.file;
              if (!fs.existsSync(filePath)) {
                errors.push(filePath + ': 파일이 존재하지 않습니다.');
                continue;
              }

              const content = fs.readFileSync(filePath, 'utf-8');

              // JS export 형식 확인
              if (!content.match(/var\s+\w+\s*=\s*\{/)) {
                errors.push(filePath + ': var 선언이 없습니다.');
              }
              if (!content.match(/export\s*\{/)) {
                errors.push(filePath + ': export 구문이 없습니다.');
              }

              // exportName 확인 — 파일 내 raw substring 탐색이 아닌 실제 export 구문 검사
              // content.includes(expectedExport) 방식은 번역 값 안에 해당 문자열이 있으면
              // 오탐이 발생하므로, export{...as <name>} 형태의 클로즈에서 as 뒤 식별자를 직접 검사합니다.
              const expectedExport = vInfo.exportName;
              const escapedExport = expectedExport.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              // (1) export{<local> as <exportName>} 구문이 존재하는지 확인
              const exportClausePattern = new RegExp('export\\s*\\{[^}]*\\b(\\w+)\\s+as\\s+' + escapedExport + '\\b[^}]*\\}');
              const exportMatch = content.match(exportClausePattern);
              if (!exportMatch) {
                errors.push(filePath + ': export 구문에서 \"' + expectedExport + '\"이(가) 내보내지지 않습니다. export{...as ' + expectedExport + '} 형태로 명시해야 합니다.');
              } else {
                // (2) export 좌변의 로컬 바인딩이 파일 내에서 실제로 선언되어 있는지 검사합니다.
                // export{missing as ko_KR}처럼 undeclared 식별자를 내보내는 경우
                // JS 문법 파서(new Function)는 통과하지만 브라우저에서 모듈 로드 시 실패합니다.
                const localBinding = exportMatch[1];
                const escapedLocal = localBinding.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const declPattern = new RegExp('(?:^|[\\s;{,(])(?:var|const|let|function)\\s+' + escapedLocal + '\\b');
                if (!declPattern.test(content)) {
                  errors.push(filePath + ': export 바인딩 \"' + localBinding + '\"이(가) 파일 내에 선언되지 않았습니다. \"export{' + localBinding + ' as ' + expectedExport + '}\"에서 \"' + localBinding + '\"은 var/const/let/function으로 선언되어 있어야 합니다.');
                }
              }

              // JS 문법 검증 — ESM export 구문을 제거한 후 파싱하여
              // 누락된 콤마 등 구조적 오류를 감지합니다.
              // (new Function()은 classic script만 지원하므로 export 구문이 있으면 실패)
              try {
                const scriptContent = content.replace(/export\s*\{[^}]*\}\s*;?\s*$/, '');
                new Function(scriptContent);
              } catch (syntaxErr) {
                errors.push(filePath + ': JS 문법 오류 — ' + syntaxErr.message);
              }
            }
          }

          // locale-meta.json에 등록되지 않은 orphan locale 파일 검사
          // 플러그인은 locale-meta.json을 통해서만 파일을 탐색하므로,
          // locales/ 디렉토리에 존재하지만 메타에 등록되지 않은 파일은 프로덕션에서
          // 도달 불가능합니다. PR에서 미리 차단합니다.
          const registeredFiles = new Set();
          for (const [code2, entry2] of Object.entries(meta.locales)) {
            for (const [ver2, vInfo2] of Object.entries(entry2.versions)) {
              registeredFiles.add(path.resolve(vInfo2.file));
            }
          }

          function walkDir(dir) {
            if (!fs.existsSync(dir)) return [];
            const results = [];
            for (const dirent of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, dirent.name);
              if (dirent.isDirectory()) {
                results.push(...walkDir(fullPath));
              } else if (dirent.isFile() && dirent.name.endsWith('.js')) {
                results.push(fullPath);
              }
            }
            return results;
          }

          const allLocaleFiles = walkDir('locales');
          for (const filePath of allLocaleFiles) {
            if (!registeredFiles.has(path.resolve(filePath))) {
              errors.push(filePath + ': locale-meta.json에 등록되지 않은 파일입니다. 플러그인이 이 파일을 로드할 수 없으므로 locale-meta.json에 등록하거나 파일을 제거하세요.');
            }
          }

          if (errors.length > 0) {
            console.error('❌ chunk 파일 검증 실패:\\n');
            errors.forEach(e => console.error('  - ' + e));
            process.exit(1);
          }

          console.log('✅ 모든 chunk 파일 검증 통과');
          "
